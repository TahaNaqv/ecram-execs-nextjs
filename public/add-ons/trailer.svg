<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Luggage trailer">
  <!-- Placeholder until the photo of the all-black Debon Roadster 255 with the Ecram Execs logo arrives (26 Nov 2026) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f6"/>
      <stop offset="1" stop-color="#e4e5e9"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2b30"/>
      <stop offset="0.55" stop-color="#101114"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="430" cy="452" rx="300" ry="16" fill="#000" opacity="0.12"/>
  <!-- drawbar and jockey wheel -->
  <path d="M120 392 L232 380 L232 398 L120 404 Z" fill="#1b1c20"/>
  <circle cx="114" cy="398" r="11" fill="#1b1c20"/>
  <rect x="176" y="398" width="7" height="34" fill="#2b2c31"/>
  <circle cx="179.5" cy="438" r="9" fill="#1b1c20"/>
  <!-- body: rounded aerodynamic nose, flat rear with ramp door -->
  <path d="M232 400 L232 260 C232 196 286 158 356 158 L700 158 C712 158 720 166 720 178 L720 400 Z" fill="url(#body)"/>
  <path d="M250 214 C270 182 312 170 356 170 L700 170" stroke="url(#shine)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- rear ramp door outline and lock -->
  <path d="M640 178 L640 392" stroke="#2f3036" stroke-width="3"/>
  <rect x="652" y="276" width="14" height="30" rx="3" fill="#3a3b41"/>
  <!-- side seam and logo area -->
  <path d="M232 318 L720 318" stroke="#26272c" stroke-width="2"/>
  <rect x="360" y="232" width="200" height="44" rx="4" fill="none" stroke="#3a3b41" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="460" y="260" text-anchor="middle" font-family="Georgia, serif" font-size="18" letter-spacing="6" fill="#9a9ba3">ECRAM EXECS</text>
  <!-- mudguard and wheel -->
  <path d="M396 400 C396 360 428 336 466 336 C504 336 536 360 536 400 Z" fill="#08080a"/>
  <circle cx="466" cy="410" r="42" fill="#0c0d10"/>
  <circle cx="466" cy="410" r="24" fill="#2c2d33"/>
  <circle cx="466" cy="410" r="8" fill="#4a4b52"/>
  <!-- rear light -->
  <rect x="712" y="352" width="10" height="22" rx="2" fill="#7a1b1b"/>
</svg>
