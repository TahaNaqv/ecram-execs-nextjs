# /etc/nginx/sites-available/ecram-execs   (replace example.nl with the real domain)
# Certbot adds the HTTPS server block and the http→https redirect for you; see docs/server-setup.md.

# Rate-limit the endpoints a bot would hammer. 10 MB of body is plenty: files never pass through this server.
limit_req_zone $binary_remote_addr zone=ecram_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name example.nl www.example.nl;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # OVERWRITE, never append: the app takes the first X-Forwarded-For entry as the visitor's address
        # for rate limiting, so a client-supplied header must not survive.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=ecram_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
