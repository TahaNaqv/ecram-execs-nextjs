# /etc/nginx/sites-available/ecram-execs
# Canonical address: https://www.ecramexecs.nl. The bare domain redirects to it.
# Certbot adds the HTTPS server blocks and the http→https redirect:
#   sudo certbot --nginx -d ecramexecs.nl -d www.ecramexecs.nl --redirect --agree-tos -m <your email>
# Both $scheme and $request_uri are kept in the redirect below, so it stays correct after certbot copies it.

# Rate limits. /api/ is limited as a whole; every POST (Server Actions: the forms, including the one that hands out
# document-upload links) is limited per visitor too. GETs have an empty key, which nginx does not limit.
limit_req_zone $binary_remote_addr zone=ecram_api:10m rate=30r/s;
map $request_method $ecram_post_key { POST $binary_remote_addr; default ""; }
limit_req_zone $ecram_post_key zone=ecram_post:10m rate=5r/s;

# Access log without query strings: /api/documents/ links carry signed tokens, which must not sit in a log file.
log_format ecram '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

# The bare domain → www
server {
    listen 80;
    listen [::]:80;
    server_name ecramexecs.nl;
    return 301 $scheme://www.ecramexecs.nl$request_uri;
}

# The site. `default_server` + `_` also answers requests made by IP address (handy for testing before DNS).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.ecramexecs.nl _;

    # Documents are uploaded through this server (5 MB each, four per application); 10 MB leaves headroom.
    client_max_body_size 10m;
    access_log /var/log/nginx/ecram.access.log ecram;

    location / {
        limit_req zone=ecram_post burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # OVERWRITE, never append: the app takes the first X-Forwarded-For entry as the visitor's address
        # for rate limiting, so a client-supplied header must not survive.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=ecram_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
