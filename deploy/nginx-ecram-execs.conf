# /etc/nginx/sites-available/ecram-execs
# Canonical address: https://www.ecramexecs.nl. The bare domain redirects to it.
# Certbot adds the HTTPS server blocks and the http→https redirect:
#   sudo certbot --nginx -d ecramexecs.nl -d www.ecramexecs.nl --redirect --agree-tos -m <your email>
# Both $scheme and $request_uri are kept in the redirect below, so it stays correct after certbot copies it.

# Rate-limit the endpoints a bot would hammer. 10 MB of body is plenty: files never pass through this server.
limit_req_zone $binary_remote_addr zone=ecram_api:10m rate=30r/s;

# The bare domain → www
server {
    listen 80;
    listen [::]:80;
    server_name ecramexecs.nl;
    return 301 $scheme://www.ecramexecs.nl$request_uri;
}

# The site. `default_server` + `_` also answers requests made by IP address (handy for testing before DNS).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.ecramexecs.nl _;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # OVERWRITE, never append: the app takes the first X-Forwarded-For entry as the visitor's address
        # for rate limiting, so a client-supplied header must not survive.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=ecram_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
